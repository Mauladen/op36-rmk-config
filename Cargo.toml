[package]
name = "kb3w6hs"
version = "0.1.0"
authors = ["Danil Antoshkin <twertrue@yandex.ru>"]
description = "Beekeeb 3W6HS firmware (RMK, RP2040)"
homepage = "https://github.com/Mauladen/3w6hs-rmk-config"
repository = "https://github.com/Mauladen/3w6hs-rmk-config"
readme = "README.md"
edition = "2024"
license = "MIT OR Apache-2.0"
# Bare-metal target has no `test`/`std` — disable auto test harnesses (E0463).
autotests = false
autobenches = false
autoexamples = false

[[bin]]
name = "kb3w6hs"
path = "src/main.rs"
test = false
bench = false

[dependencies]
rmk = { path = "../rmk/rmk", default-features = false, features = [
    "rp2040",
    "storage",
    "defmt",
] }
# Embassy RP2040 HAL: the I2C0 bus for the right-half TCA9555 expander and the
# time driver embassy-time needs on this chip. `critical-section-impl` provides
# the critical section portable-atomic routes through on thumbv6m.
embassy-rp = { version = "0.10", features = [
    "rp2040",
    "defmt",
    "time-driver",
    "critical-section-impl",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
embassy-time = { version = "0.5", features = ["defmt"] }
embedded-hal-async = "1.0"
portable-atomic = { version = "1", features = ["critical-section"] }

cortex-m-rt = "0.7.5"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
